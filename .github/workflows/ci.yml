name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # 测试只 import 本地文件，不需要安装依赖。
      - run: npm test
      - name: 检查打包内容
        run: npm pack --dry-run
